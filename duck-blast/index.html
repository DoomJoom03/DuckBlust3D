<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.y8.com/minimal-sdk/2-0/y8.min.js" async></script>
    <title>Duck Blast 3D</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <canvas id="view"></canvas>
    <div id="crosshair"></div>
    <div id="hud" class="hidden">
        <div id="score">SCORE 0</div>
        <div id="wave">WAVE 1</div>
        <div id="lives"></div>
        <div id="shells"></div>
        <div id="banner"></div>
    </div>
    <div id="flash"></div>
    <section id="menu" class="panel">
        <h1>DUCK BLAST 3D</h1>
        <p>The ducks can see your aim. Hit them before they dodge.</p>
        <ul>
            <li>Mouse: aim the shotgun</li>
            <li>Left click: fire</li>
            <li>R: reload</li>
            <li>P: pause</li>
        </ul>
        <button id="start">START HUNT</button>
    </section>
    <section id="over" class="panel hidden">
        <h1>GAME OVER</h1>
        <p id="final"></p>
        <p id="best"></p>
        <button id="restart">HUNT AGAIN</button>
    </section>
    <script src="js/three.min.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/duck.js"></script>
    <script src="js/game.js"></script>
    <script>
        let y8Sdk;

        window.addEventListener("y8sdk.ready", function () {
            y8Sdk = y8.sdk();

            const appConfig = {
                appId: '6acce3e0f3cade1a6394966e',
                autoLogin: true
            };

            // adConfig is optional — omit it if your game doesn't use ads
            const adConfig = {
                gameId: '287361',
                preloadAdBreaks: 'on',
                sound: 'on',
                onReady: () => { }
            };

            y8Sdk.init(appConfig, adConfig);
            y8Sdk.onAuth((user, error) => { });
        }, { once: true });

        // Handle the case where the SDK already loaded
        if (window.y8 && window.y8.emitReadyEvent) {
            window.y8.emitReadyEvent();
        }
    </script>
</body>

</html>
